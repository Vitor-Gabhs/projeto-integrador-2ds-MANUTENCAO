<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width-device-width, initial-scale=1.0">
    <title>Login CEP</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="logincard">
    <div class="logoEMsg">
        <img class="logoCep" src="../assets/logoCep180.png" width="300">
        <span class="linha"></span>
        <h1 class="logintxt">LOGIN</h1>
        <span class="ltxt">Bem-vindo</span>
        <label>
            <form for="user">Nome de usuário</form>
            <input type="text" id="username" name="username" placeholder="digite seu nome de usuário">
            <form for="password">Senha</form>
            <input type="password" id="password" name="password" placeholder="digite sua senha" aria-invalid="false">
            <input type="submit" value="Continuar" id="submit" class="submit">
        </label>
        <div class="outros">
        <img src="https://sso.acesso.gov.br/assets/govbr/fontawesome/webfonts/circle-question-solid.svg" height="30px" width="30px">
        <span class="links">
            <a href="">Não tem conta?</a><br>
            <a href="">Esqueceu a senha?</a>
        </span>
        </div>
</div>
</body>

</html>
